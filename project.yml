name: TriColumns
options:
  bundleIdPrefix: st.rio
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: 23889H77KX
targets:
  TriColumns:
    type: application
    platform: macOS
    sources:
      - path: Sources/TriColumns
      - path: Resources
        excludes:
          - ReviewDemo
        buildPhase: resources
      - path: Resources/ReviewDemo
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: st.rio.tricolumns
        PRODUCT_NAME: TriColumns
        INFOPLIST_FILE: AppBundle/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppBundle/TriColumns.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 7
        MARKETING_VERSION: 1.1.1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    entitlements:
      path: AppBundle/TriColumns.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    scheme:
      gatherCoverageData: false
      testTargets: []
